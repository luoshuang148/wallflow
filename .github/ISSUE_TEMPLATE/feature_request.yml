name: 功能建议 / Feature request
description: 描述使用场景与希望的行为 / Describe a use case and desired behavior
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        欢迎中文或英文，提交前请搜索现有建议。 / Chinese and English are welcome; search existing requests first.
        当前专注视频壁纸。请描述实际需求，无需先给出技术方案。 / The current focus is video wallpapers. Describe your need; a technical solution is not required.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题 / Use case and problem
      description: 你在什么操作中遇到不便？目前如何处理？ / What are you trying to do, and how do you handle it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Desired behavior
      description: 这个功能怎样改善你的使用体验？ / How would this improve your experience?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 如果尝试过其他做法，请简单说明。 / Describe any alternatives you have tried.
