name: 功能建议 / Feature request
description: 描述使用场景与希望的行为 / Describe a use case
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题 / Use case and problem
      description: 你在什么操作中遇到不便？目前如何处理？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
