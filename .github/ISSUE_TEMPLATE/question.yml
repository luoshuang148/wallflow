name: 使用求助 / Usage question
description: 安装、配置或使用上的疑问 / Help with installation, setup, or usage
title: "[Help]: "
body:
  - type: markdown
    attributes:
      value: |
        欢迎中文或英文。请先查看[中文指南](https://github.com/luoshuang148/wallflow/blob/main/docs/USER_GUIDE.md)或 [English guide](https://github.com/luoshuang148/wallflow/blob/main/docs/USER_GUIDE.en.md)。
        Chinese and English are welcome. Please check the user guide first.
        请隐藏账号、个人路径和会话信息。 / Remove accounts, personal paths, and session data from attachments.
  - type: input
    id: environment
    attributes:
      label: 应用版本与设备 / App version and device
      placeholder: WallFlow 0.7.1, macOS 14.x, Apple M2
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 你想完成什么，在哪里遇到困难？ / What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: 已经尝试的操作 / What you have tried
      description: 可附脱敏后的错误提示或截图。 / Sanitized error messages or screenshots are welcome.
